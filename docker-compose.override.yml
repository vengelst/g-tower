# Dev-Override: Wird automatisch bei `docker compose up` gemergt.
# In Prod explizit nur die Basis-Datei nutzen:
#   docker compose -f docker-compose.yml up -d
services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
