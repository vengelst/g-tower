services:
  postgres:
    image: postgres:16-alpine
    container_name: gtower-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtower -d gtower"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    container_name: gtower-backend
    env_file: .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: gtower-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
