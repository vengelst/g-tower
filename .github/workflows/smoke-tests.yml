name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Create .env for CI (dev compose)
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=gtower
          POSTGRES_PASSWORD=gtower_secret_2024
          POSTGRES_DB=gtower
          DATABASE_URL=postgresql://gtower:gtower_secret_2024@postgres:5432/gtower
          JWT_SECRET=ci_smoke_secret_do_not_use_in_production
          CORS_ORIGINS=http://localhost:5173
          EOF

      - name: Start backend + db (docker compose)
        shell: bash
        run: |
          docker compose up -d --build postgres backend

      - name: Wait for DB + Backend
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for postgres..."
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U gtower -d gtower >/dev/null 2>&1; then
              echo "Postgres ready."
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U gtower -d gtower >/dev/null

          echo "Waiting for backend /api/health..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Backend ready."
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health >/dev/null

      - name: Install backend dependencies
        shell: bash
        run: |
          cd backend
          npm ci

      - name: Run backend smoke tests
        shell: bash
        run: |
          cd backend
          npm test

      - name: Show compose logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps
          docker compose logs --no-color --tail 300 postgres backend

